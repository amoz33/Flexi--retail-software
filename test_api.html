<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    
    <div>
        <button onclick="testAPI()">Test Products API</button>
        <button onclick="testOrdersAPI()">Test Orders API</button>
    </div>
    
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>
    
    <script>
        function testAPI() {
            document.getElementById('result').innerHTML = 'Testing...';
            
            fetch('http://localhost:8001/api/products/customer')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('result').innerHTML = 
                        `<strong>✅ Success!</strong><br>` +
                        `Products API working. Found ${data.products?.length || 0} products.`;
                })
                .catch(error => {
                    document.getElementById('result').innerHTML = 
                        `<strong>❌ Error:</strong><br>` +
                        `${error.message}<br><br>` +
                        `<strong>Possible issues:</strong><br>` +
                        `1. Laravel server not running (port 8001)<br>` +
                        `2. CORS configuration issue<br>` +
                        `3. Network connectivity problem`;
                });
        }
        
        function testOrdersAPI() {
            document.getElementById('result').innerHTML = 'Testing orders API...';
            
            const orderData = {
                source: "Test Order",
                customer: {
                    name: "Test Customer",
                    phone: "+1234567890",
                    email: "test@example.com",
                    address: ""
                },
                delivery_option: "Pickup",
                delivery_note: "",
                payment_method: "Card Payment",
                payment_status: "Paid",
                items: [
                    {
                        name: "Test Product",
                        sku: "TEST-001",
                        price: 1000,
                        quantity: 1
                    }
                ],
                subtotal: 1000,
                delivery_fee: 0,
                total: 1000
            };
            
            fetch('http://localhost:8001/api/orders', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(orderData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('result').innerHTML = 
                    `<strong>✅ Success!</strong><br>` +
                    `Orders API working. Order ID: ${data.order?.id || 'N/A'}`;
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    `<strong>❌ Error:</strong><br>` +
                    `${error.message}<br><br>` +
                    `<strong>Check:</strong><br>` +
                    `1. Laravel server on port 8001<br>` +
                    `2. Database connection<br>` +
                    `3. API endpoint validation`;
            });
        }
    </script>
</body>
</html>
